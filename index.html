<form id="form-handy-secure">
    <label for="name">Nombre de Contacto:</label>
    <input type="text" id="name" required>

    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" required>

    <label for="rol">Rol del Interesado:</label>
    <select id="rol" required>
        <option value="Padre/Madre">Padre / Madre de Familia</option>
        <option value="Docente">Docente / Tutor de Apoyo</option>
    </select>

    <button type="submit" class="btn-submit">
        ¡Solicitar Acceso Gratuito!
    </button>
</form>
